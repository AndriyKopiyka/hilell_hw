<body>


    <section class="class-bground">



        <div class="class-input">

            <div class="class-swich">

                <div class="switch">
                    <input checked id="login" type="radio" name="subscribe">

                    <label for="login">
                        Login
                    </label>
                </div>

                <div class="switch">
                    <input id="register" type="radio" name="subscribe">

                    <label for="register">
                        Register
                    </label>
                </div>


            </div>

            <div class="class-form">

                <h2 class="class-h2">Login</h2>

                <form action="">

                    <input class="input" placeholder="E-mail" type="email">

                    <input class="input" placeholder="Password" type="password">


                    <div class="class-check">

                        <label class="custom-checkbox">
                            <input type="checkbox" name="remember">
                            <span class="checkbox-border"></span>
                            Remember Me
                        </label>

                        <a href="">Forgot password?</a>
                    </div>



                    <button class="class-button">Login</button>

                </form>

                <div class="class-register">
                    <span>Don't have an account yet?</span>
                    <a href="">Register</a>
                </div>

                <div class="class-login">Or login </div>



                <ul class="social-list">
                    <li>
                        <a href="#">

                            <svg class="social-svg" width="20" height="20">
                                <use href="#instagram"></use>
                            </svg>
                        </a>
                    </li>

                    <li class="class-facebook"><a href="#">
                            <svg class="social-svg" width="20" height="20">
                                <use href="#facebook"></use>
                            </svg>

                        </a></li>

                    <li><a href="#">
                            <svg class="social-svg" width="20" height="20">
                                <use href="#in"></use>
                            </svg>
                        </a></li>
                </ul>



            </div>
            <div class="invisble"></div>




        </div>




    </section>
